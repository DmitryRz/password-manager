version: '3.8'
name: password-manager-project

services:
  db:
    image: postgres:15
    container_name: password-manager-db
    restart: always
    environment:
      POSTGRES_DB: password_manager
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "6432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    build: ./server
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/password_manager
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata: